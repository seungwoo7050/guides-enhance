# [Implementation 1] datasource·Flyway·스키마 검증 연결
# migration을 먼저 적용한 뒤 Hibernate가 entity와 실제 스키마가 같은지 확인합니다.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/locking
    username: locking
    password: locking
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoint:
    health:
      probes:
        enabled: true
