{% extends "base.html" %}

{% block title %}로그인 · Catalog Site{% endblock %}

{% block content %}
<section class="panel narrow">
  <h1>로그인</h1>
  {% if form.errors %}
    <p class="error">사용자 이름 또는 비밀번호를 확인해 주세요.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <button type="submit">로그인</button>
  </form>
  <p><a href="{% url 'accounts:signup' %}">계정 만들기</a></p>
</section>
{% endblock %}
