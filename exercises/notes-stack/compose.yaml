# [Implementation 9] Define the database, application, and gateway services
services:
  db:
    build:
      context: ./db
    environment:
      MARIADB_DATABASE: appdb
      MARIADB_USER: appuser
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_root_password
      - db_password
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin --protocol=socket --socket=/run/mysqld/mysqld.sock -uroot -p\"$$(cat /run/secrets/db_root_password)\" ping --silent"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 10s

  # [Implementation 9-1] Wait for healthy dependencies before starting downstream services
  app:
    build:
      context: ./app
    environment:
      DB_HOST: db
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    tmpfs:
      - /run/app-secrets
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "REQUEST_METHOD=GET SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 5s

  gateway:
    build:
      context: ./gateway
    environment:
      APP_UPSTREAM: app:9000
      CERT_CN: localhost
    ports:
      - "127.0.0.1:${TLS_PORT:-19443}:443"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "curl", "-kfsS", "https://127.0.0.1/healthz"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 5s

# [Implementation 9-2] Isolate internal traffic and persist database files
networks:
  app-net:
    driver: bridge

volumes:
  db-data:

secrets:
  db_root_password:
    file: ./secrets/db_root_password.txt
  db_password:
    file: ./secrets/db_password.txt
