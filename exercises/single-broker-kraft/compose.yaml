# [Implementation 1] 고정된 Kafka 이미지와 실행 식별자
# digest로 고정한 Kafka image와 run ID label로 이 실행이 만든 broker를 식별합니다.
services:
  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    labels:
      dev.standalone.run-id: "${KRAFT_RUN_ID:-manual}"

    # [Implementation 2] 단일 프로세스 KRaft 역할
    # broker와 controller 역할을 한 프로세스에 두고 listener와 quorum 설정을 연결합니다.
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"

      # [Implementation 2-1] 내부 토픽 복제 수
      # 브로커가 하나이므로 내부 토픽의 replication factor와 min ISR을 1보다 크게 둘 수 없습니다.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"

    # [Implementation 3] Kafka API 응답 기반 준비 상태
    # 프로세스 존재 여부가 아니라 kafka-topics 명령이 성공해야 준비가 끝난 것으로 봅니다.
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 2s
      timeout: 5s
      retries: 45
