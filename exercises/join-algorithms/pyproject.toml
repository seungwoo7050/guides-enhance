[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "join-algorithms"
version = "0.1.0"
description = "Nested-loop, hash, and sort-merge inner joins with SQL bag semantics"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["joins"]
