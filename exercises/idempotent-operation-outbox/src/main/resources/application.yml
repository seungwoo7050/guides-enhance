spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/idempotency
    username: idempotency
    password: idempotency
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 500ms
guide:
  outbox:
    batch-size: 20
    initial-delay-ms: 1000
    poll-delay-ms: 1000
    retry-delay: 5s
