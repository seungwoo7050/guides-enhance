[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slotted-page"
version = "0.1.0"
description = "Variable-length slotted page with stable record identifiers"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["slotted_page"]
