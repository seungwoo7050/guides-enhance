[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clock-buffer-pool"
version = "0.1.0"
description = "Clock-replacement buffer pool with pin and dirty-page ownership"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["buffer_pool"]
